{% extends "base.html" %}
{% block title %}Вход — {{ product_name }}{% endblock %}
{% block content %}
<div class="auth-container">
    <h1 class="auth-title">Вход</h1>
    <p class="auth-subtitle">Войдите в свой аккаунт</p>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Введите логин" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark" style="margin-bottom: 20px;"></div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>
    </div>
    <p class="auth-footer">
        Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </p>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
