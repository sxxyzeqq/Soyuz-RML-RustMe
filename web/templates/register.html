{% extends "base.html" %}
{% block title %}Регистрация — {{ product_name }}{% endblock %}
{% block content %}
<div class="auth-container">
    <h1 class="auth-title">Регистрация</h1>
    <p class="auth-subtitle">Создайте аккаунт для доступа к читам</p>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Придумайте логин (a-z, 0-9, _)" required minlength="4" autocomplete="username">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password">
            </div>
            <div class="cf-turnstile" data-sitekey="{{ site_key }}" data-theme="dark" style="margin-bottom: 20px;"></div>
            <button type="submit" class="btn btn-primary btn-block">Создать аккаунт</button>
        </form>
    </div>
    <p class="auth-footer">
        Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
    </p>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endblock %}
